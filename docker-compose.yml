name: fantasy-land

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      - API_PROXY_TARGET=http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:${FRONTEND_PORT:-5173}
      - DATABASE_URL=postgres://app:app@db:5432/fantasy_land
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fantasy_land
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d fantasy_land']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  frontend_node_modules:
  backend_node_modules:
  db_data:
